services:
  bot:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: youtube-telegram-bot
    restart: unless-stopped
    init: true
    env_file:
      - .env
    environment:
      BOT_DATA_ENV_OVERRIDE: "true"
    volumes:
      # Данные бота и настройки, сохранённые через /admin.
      - ./data:/app/data
